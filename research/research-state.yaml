      timestamp: "2026-09-11"
    - run_id: "walkthrough-v1.2-p001"
      hypothesis: "H8"
      config: "kaggle_walkthrough_t4x2 (v1.2)"
      metric_value: null
      pass_rate: null
      delta: null
      wall_time_min: 6
