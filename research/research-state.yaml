# Trạng thái nghiên cứu CTIG - theo mẫu skill autoresearch (hai vòng: inner thí nghiệm, outer tổng hợp).
# Cập nhật sau MỖI lần chạy Kaggle: thêm một dòng vào experiments.trajectory.
project:
  title: "CTIG - Cultural Text-to-Image Generation cho miền Việt Nam"
  question: >
    Một pipeline agentic có truy hồi bằng chứng và vòng review VLM+CLIP có làm SDXL vẽ đúng
    thực thể văn hoá Việt Nam hơn so với sinh trực tiếp không, và khối nào đóng góp bao nhiêu?
  status: active
  started: "2026-09-11"
  domain: "cultural text-to-image, agentic review"

literature:
  key_papers: []          # điền khi làm literature/ (chưa làm)
  open_problems:
    - "T2I thay thực thể văn hoá ít dữ liệu bằng thực thể tương tự của văn hoá đông dữ liệu hơn"
    - "Bằng chứng văn hoá kiểm chứng được bằng mắt gần như không có trong Wikipedia"
  evidence_gaps:
    - "Không có bộ prompt và nhãn vàng cho văn hoá Việt; bộ 50 prompt hiện tại do người viết code soạn"

hypotheses:
  - id: H1
    statement: "Vòng review (checklist VLM + CLIP) nâng CLIP fidelity và tỉ lệ đạt so với vòng 0"
    status: active
    motivation: "Lần smoke v1: p050 vòng 0 không có áo dài, vòng 1 có. Chưa đo trên tập dev."
    priority: high
    prediction: "CLIP fidelity cuối > vòng 0 ít nhất 0.10 trên dev10; tỉ lệ đạt cuối > vòng 0"
  - id: H2
    statement: "Bước rút bằng chứng từ web tiếng Việt (DuckDuckGo) cho nhiều must_have thị giác hơn Wikipedia"
    status: pending
    motivation: "Wikipedia thiên lịch sử; blog tiếng Việt mô tả 'sườn nón là nan tre, quai buộc đối xứng'"
    priority: high
    prediction: "Số must_have rút được có câu gốc >= 3 cho >= 70% thực thể trong dev10 khi bật ddg; < 50% khi chỉ Wikipedia"
  - id: H3
    statement: "Judge BLIP-2 ITM tương quan với người chấm tốt hơn judge Qwen"
    status: pending
    motivation: "Judge Qwen chấm 0.98 khi reviewer fail và trả lời bằng tiếng Trung"
    priority: medium
    prediction: "Spearman(judge, người) của BLIP-2 ITM > của Qwen trên user_study.csv"
  - id: H4
    statement: "IP-Adapter với ảnh tham chiếu đã kiểm CLIP >= 0.75, scale 0.3, không làm ảnh tệ hơn"
    status: pending
    motivation: "v1 scale 0.45, ref CLIP 0.64: nón lá neon khổng lồ"
    priority: medium
    prediction: "CLIP fidelity có IP-Adapter >= không IP-Adapter trên các prompt có thực thể object"
  - id: H5
    statement: "Prompt engineering không cứu được thực thể prior thấp (đàn bầu, thuyền thúng); cần LoRA"
    status: pending
    motivation: "Ablation mô phỏng: bỏ LoRA tụt fidelity 0.89 -> 0.64. Chưa có LoRA thật để kiểm."
    priority: high
    prediction: "p009, p012 không đạt sau 2 vòng dù negative và nhấn; cần dữ liệu LoRA"
  - id: H6
    statement: "Qwen2.5-VL-3B trả lời checklist đóng ổn định hơn viết findings tự do"
    status: active
    motivation: "v1 findings lặp 'không có thông tin về...', điểm 0.6 cố định"
    priority: high
    prediction: "Tỉ lệ đáp án 'unsure' < 30%; identity khớp CLIP >= 70% trên thực thể object"
  - id: H7
    statement: "Thực thể bối cảnh (Tết, chợ nổi) chỉ kiểm được bằng checklist VLM, CLIP vô dụng"
    status: pending
    motivation: "v1: Tết vắng cả 3 vòng, CLIP 0.99, không ai bắt"
    priority: medium
    prediction: "Với kind=context, checklist identity=absent được bắt ở >= 80% ca ảnh không có dấu hiệu Tết"

  - id: H8
    statement: "SDXL + LoRA áo dài cho CLIP attr / ITM attr cao hơn SDXL gốc trên prompt có áo dài"
    status: active
    motivation: "v1.2.1 p001: LoRA gắn được; attr 0,40/0,52 vs SDXL gốc 0,45/0,40 — chưa phân biệt với n=2"
    priority: medium
    prediction: "Trên >= 5 prompt áo dài × 4 seed, sdxl_aodai > sdxl_base về CLIP attr trung bình ít nhất 0,10"
  - id: H9
    statement: "Negative prompt theo must_not_en (KB) giảm lỗi 'áo dài không quần' mà tên confusable không chặn được"
    status: active
    motivation: "v1.2.1 p001: negative chỉ có kimono/qipao/hanbok, 4/12 ảnh là váy xẻ tà không quần; CLIP attr bắt đúng (0,18–0,40)"
    priority: high
    prediction: "Cùng seed, cùng model: tỉ lệ ảnh có quần dài tăng, CLIP attr trung bình tăng >= 0,10 trên p001, p031"

  - id: H10
    statement: "Best-of-N (N=4) chọn theo điểm tổng (attr + ITM attr + PickScore) cho ảnh cuối đúng thuộc tính hơn ảnh seed đầu"
    status: active
    motivation: "p001 v1.2.1: cùng model, attr 0,51 vs 0,33 theo seed; chọn được là tăng chắc chắn nhất, rẻ nhất"
    priority: high
    prediction: "Trên dev10, CLIP attr của ứng viên được chọn > ứng viên c0 trung bình >= 0,10; đối chiếu mắt người đồng ý >= 70%"
  - id: H11
    statement: "Hires fix ×1.5 strength 0.3 tăng PickScore mà không giảm CLIP attr"
    status: active
    motivation: "Mặt và hoa văn vải là chỗ SDXL hỏng nhất trên ảnh toàn thân (grid p001)"
    priority: medium
    prediction: "Cùng seed: PickScore(hires) > PickScore(gốc) ở >= 70% ảnh; CLIP attr đổi < 0,05"
  - id: H12
    statement: "RealVisXL V4 cho PickScore và CLIP attr cao hơn SDXL base trên cùng GenSpec và seed"
    status: active
    motivation: "SDXL base là điểm yếu nhất về thẩm mỹ; fine-tune thực ảnh cùng gốc nên LoRA áo dài dùng được"
    priority: medium
    prediction: "Trên >= 4 prompt trang phục, realvis_xl > sdxl_base về PickScore thô >= 0,5 và không thấp hơn về attr"

