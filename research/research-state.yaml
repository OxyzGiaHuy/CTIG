# Trạng thái nghiên cứu CTIG - theo mẫu skill autoresearch (hai vòng: inner thí nghiệm, outer tổng hợp).
# Cập nhật sau MỖI lần chạy Kaggle: thêm một dòng vào experiments.trajectory.
project:
  title: "CTIG - Cultural Text-to-Image Generation cho miền Việt Nam"
  question: >
    Một pipeline agentic có truy hồi bằng chứng và vòng review VLM+CLIP có làm SDXL vẽ đúng
    thực thể văn hoá Việt Nam hơn so với sinh trực tiếp không, và khối nào đóng góp bao nhiêu?
  status: active
  started: "2026-09-11"
  domain: "cultural text-to-image, agentic review"

literature:
  key_papers:
    - id: culture-trip-2025
      title: "Culture-TRIP: Culturally-Aware Text-to-Image Generation with Iterative Prompt Refinement (NAACL 2025)"
      url: "https://arxiv.org/abs/2502.16902"
      takeaway: "Truy hồi Wikipedia/web về danh từ văn hoá rồi LLM sửa prompt lặp theo bộ tiêu chí; đánh giá bằng khảo sát 66 người 8 nước. Vòng lặp nằm ở VĂN BẢN, không nhìn ảnh."
    - id: cultivate-2025
      title: "Culture in Action: Evaluating Text-to-Image Models through Social Activities (CULTIVate)"
      url: "https://arxiv.org/abs/2511.05681"
      takeaway: "Đánh giá bằng descriptor: VLM (InternVL3-14B, Qwen2.5-VL-7B) chỉ TRÍCH mô tả ảnh, rồi so với descriptor tham chiếu bằng embedding; đo Alignment/Hallucination/Exaggeration. Tương quan với người cao hơn MLLM-as-judge 27%."
    - id: cure-2025
      title: "CuRe: Cultural Gaps in the Long Tail of Text-to-Image Systems"
      url: "https://arxiv.org/abs/2506.08071"
      takeaway: "Điểm 'marginal utility of attribute specification': thêm thuộc tính vào prompt thì ảnh đổi bao nhiêu; metric alignment thường tương quan yếu với người."
    - id: marmot-2025
      title: "Marmot: Multi-Agent Reasoning for Multi-Object Self-Correcting"
      url: "https://arxiv.org/abs/2504.20054"
      takeaway: "Decision-maker / Executor / Verifier với model 8B; hai tầng: MLLM mô tả thuộc tính từng vật thể, LLM so văn bản; giới hạn số vòng. Cơ sở cho Filter hai tầng của CTIG."
    - id: imagerag-2026
      title: "ImageRAG: Dynamic Image Retrieval for Reference-Guided Image Generation (ICLR 2026)"
      url: "https://arxiv.org/abs/2502.09411"
      takeaway: "Truy hồi ảnh CÓ ĐIỀU KIỆN: VLM báo khái niệm thiếu -> caption -> CLIP lấy ảnh LAION -> IP-Adapter scale 0.5, <= 3 ảnh. 84-92% thành công khái niệm hiếm. Cơ sở cho auto_ref (v1.5)."
    - id: ma-2025-inference-scaling
      title: "Inference-Time Scaling for Diffusion Models beyond Scaling Denoising Steps (CVPR 2025)"
      url: "https://arxiv.org/abs/2501.09732"
      takeaway: "Best-of-N và tìm nhiễu theo verifier; verifier đơn bị hack (Aesthetic thiên style, CLIP thiên chữ) -> Verifier Ensemble = trung bình hạng. Cơ sở cho ensemble + adaptive N (v1.5)."
    - id: culturalframes-2025
      title: "CulturalFrames: Assessing Cultural Expectation Alignment in T2I Models and Evaluation Metrics"
      url: "https://arxiv.org/html/2506.08835"
      takeaway: "Model sai kỳ vọng văn hoá 44%; metric tự động tương quan với người chỉ ~0,31 (người-người 0,38); CLIPScore tệ nhất. User study là bắt buộc."
    - id: scoft-2024
      title: "SCoFT: Self-Contrastive Fine-Tuning for Equitable Image Generation (CVPR 2024) + CCUB"
      url: "https://arxiv.org/abs/2401.08053"
      takeaway: "Fine-tune SD trên bộ ảnh văn hoá nhỏ do cộng đồng chọn, loss tương phản với ảnh thiên lệch của chính model. Đường LoRA cho H5."
    - id: cultureclip-2025
      title: "CultureCLIP: Empowering CLIP with Cultural Awareness"
      url: "https://arxiv.org/abs/2507.06210"
      takeaway: "CLIP fine-tune trên cặp giống nhau khác văn hoá (+5,5% nhận diện tinh). Ứng viên thay CLIP-B/32 đang bão hoà."
    - id: mosaig-2025
      title: "When Cultures Meet: Multicultural Text-to-Image Generation (MosAIG)"
      url: "https://arxiv.org/abs/2502.15972"
      takeaway: "Prompt tiếng Việt cho alignment thấp nhất trong 5 ngôn ngữ; đa tác tử viết caption theo khía cạnh cải thiện Knowledge/Fairness."
    - id: dsg-2024
      title: "Davidsonian Scene Graph (ICLR 2024); TIFA; VQAScore"
      url: "https://arxiv.org/abs/2310.18235"
      takeaway: "Tách prompt thành câu hỏi nguyên tử + DAG phụ thuộc (không hỏi thuộc tính khi vật không có). Checklist CTIG là TIFA-kiểu; DAG chưa làm."
    - id: cultdiff-2025
      title: "CultDiff: benchmark ảnh văn hoá 10 nước, metric image-image similarity học từ phản hồi người"
      url: "https://arxiv.org/abs/2502.08914"
      takeaway: "Ảnh tham chiếu thật làm mốc so sánh; gợi ý dùng ảnh Commons đã lọc làm mốc ngoài CLIP text."
  open_problems:
    - "T2I thay thực thể văn hoá ít dữ liệu bằng thực thể tương tự của văn hoá đông dữ liệu hơn"
    - "Bằng chứng văn hoá kiểm chứng được bằng mắt gần như không có trong Wikipedia"
  evidence_gaps:
    - "Không có bộ prompt và nhãn vàng cho văn hoá Việt; bộ 50 prompt hiện tại do người viết code soạn"

hypotheses:
  - id: H1
    statement: "Vòng review (checklist VLM + CLIP) nâng CLIP fidelity và tỉ lệ đạt so với vòng 0"
    status: active
    motivation: "Lần smoke v1: p050 vòng 0 không có áo dài, vòng 1 có. Chưa đo trên tập dev."
    priority: high
    prediction: "CLIP fidelity cuối > vòng 0 ít nhất 0.10 trên dev10; tỉ lệ đạt cuối > vòng 0"
  - id: H2
    statement: "Bước rút bằng chứng từ web tiếng Việt (DuckDuckGo) cho nhiều must_have thị giác hơn Wikipedia"
    status: pending
    motivation: "Wikipedia thiên lịch sử; blog tiếng Việt mô tả 'sườn nón là nan tre, quai buộc đối xứng'"
    priority: high
    prediction: "Số must_have rút được có câu gốc >= 3 cho >= 70% thực thể trong dev10 khi bật ddg; < 50% khi chỉ Wikipedia"
  - id: H3
    statement: "Judge BLIP-2 ITM tương quan với người chấm tốt hơn judge Qwen"
    status: pending
    motivation: "Judge Qwen chấm 0.98 khi reviewer fail và trả lời bằng tiếng Trung"
    priority: medium
    prediction: "Spearman(judge, người) của BLIP-2 ITM > của Qwen trên user_study.csv"
  - id: H4
    statement: "IP-Adapter với ảnh tham chiếu đã kiểm CLIP >= 0.75, scale 0.3, không làm ảnh tệ hơn"
    status: pending
    motivation: "v1 scale 0.45, ref CLIP 0.64: nón lá neon khổng lồ"
    priority: medium
    prediction: "CLIP fidelity có IP-Adapter >= không IP-Adapter trên các prompt có thực thể object"
  - id: H5
    statement: "Prompt engineering không cứu được thực thể prior thấp (đàn bầu, thuyền thúng); cần LoRA"
    status: pending
    motivation: "Ablation mô phỏng: bỏ LoRA tụt fidelity 0.89 -> 0.64. Chưa có LoRA thật để kiểm."
    priority: high
    prediction: "p009, p012 không đạt sau 2 vòng dù negative và nhấn; cần dữ liệu LoRA"
  - id: H6
    statement: "Qwen2.5-VL-3B trả lời checklist đóng ổn định hơn viết findings tự do"
    status: active
    motivation: "v1 findings lặp 'không có thông tin về...', điểm 0.6 cố định"
    priority: high
    prediction: "Tỉ lệ đáp án 'unsure' < 30%; identity khớp CLIP >= 70% trên thực thể object"
  - id: H7
    statement: "Thực thể bối cảnh (Tết, chợ nổi) chỉ kiểm được bằng checklist VLM, CLIP vô dụng"
    status: pending
    motivation: "v1: Tết vắng cả 3 vòng, CLIP 0.99, không ai bắt"
    priority: medium
    prediction: "Với kind=context, checklist identity=absent được bắt ở >= 80% ca ảnh không có dấu hiệu Tết"

  - id: H8
    statement: "SDXL + LoRA áo dài cho CLIP attr / ITM attr cao hơn SDXL gốc trên prompt có áo dài"
    status: active
    motivation: "v1.2.1 p001: LoRA gắn được; attr 0,40/0,52 vs SDXL gốc 0,45/0,40 — chưa phân biệt với n=2"
    priority: medium
    prediction: "Trên >= 5 prompt áo dài × 4 seed, sdxl_aodai > sdxl_base về CLIP attr trung bình ít nhất 0,10"
  - id: H9
    statement: "Negative prompt theo must_not_en (KB) giảm lỗi 'áo dài không quần' mà tên confusable không chặn được"
    status: supported   # p001 v1.3: ~28/28 có quần (trước 8/12); cần thêm p031 để chắc
    motivation: "v1.2.1 p001: negative chỉ có kimono/qipao/hanbok, 4/12 ảnh là váy xẻ tà không quần; CLIP attr bắt đúng (0,18–0,40)"
    priority: high
    prediction: "Cùng seed, cùng model: tỉ lệ ảnh có quần dài tăng, CLIP attr trung bình tăng >= 0,10 trên p001, p031"

  - id: H10
    statement: "Best-of-N (N=4) chọn theo điểm tổng (attr + ITM attr + PickScore) cho ảnh cuối đúng thuộc tính hơn ảnh seed đầu"
    status: active
    motivation: "p001 v1.2.1: cùng model, attr 0,51 vs 0,33 theo seed; chọn được là tăng chắc chắn nhất, rẻ nhất"
    priority: high
    prediction: "Trên dev10, CLIP attr của ứng viên được chọn > ứng viên c0 trung bình >= 0,10; đối chiếu mắt người đồng ý >= 70%"
  - id: H11
    statement: "Hires fix ×1.5 strength 0.3 tăng PickScore mà không giảm CLIP attr"
    status: active
    motivation: "Mặt và hoa văn vải là chỗ SDXL hỏng nhất trên ảnh toàn thân (grid p001)"
    priority: medium
    prediction: "Cùng seed: PickScore(hires) > PickScore(gốc) ở >= 70% ảnh; CLIP attr đổi < 0,05"
  - id: H12
    statement: "RealVisXL V4 cho PickScore và CLIP attr cao hơn SDXL base trên cùng GenSpec và seed"
    status: active
    motivation: "SDXL base là điểm yếu nhất về thẩm mỹ; fine-tune thực ảnh cùng gốc nên LoRA áo dài dùng được"
    priority: medium
    prediction: "Trên >= 4 prompt trang phục, realvis_xl > sdxl_base về PickScore thô >= 0,5 và không thấp hơn về attr"

  - id: H13
    statement: "Filter agent hai tầng (mô tả rồi so văn bản) bắt được ảnh có must_not / sai số người mà CLIP attr và metric bỏ qua"
    status: partial    # v1.4 p001: bỏ đúng ảnh tham chiếu 5 người; nhưng tầng so văn bản vẫn 'có' khi mô tả nói ngược -> thêm luật cứng trường trang phục
    motivation: "v1.3 p001: sdxl_refplus 3/4 ảnh nhiều người dù prompt một người, attr vẫn 0,76-0,89"
    priority: high
    prediction: "Trên p001/p031/p050: >= 80% ảnh bị Filter bỏ được người đồng ý là sai; ảnh tham chiếu sau lọc làm refplus ra đúng số người"
  - id: H14
    statement: "Rank agent (từ mô tả + brief) đồng thuận với xếp hạng metric ở top-1 trong đa số prompt; chỗ bất đồng là chỗ metric sai"
    status: active
    motivation: "Cần biết có nên tin metric để chọn ảnh cuối hay phải có agent"
    priority: medium
    prediction: "Top-1 trùng >= 60% prompt; trong các ca bất đồng, người đồng ý với agent nhiều hơn metric"

  - id: H15
    statement: "Render 'tags' (thực thể + thẻ ngắn lên đầu, negative không chứa danh từ must_have, trọng số 1.2) cho CLIP attr cao hơn render 'legacy' v1.3 trên cùng model và seed"
    status: negative   # v1.4: tags 0,49 vs legacy 0,68; v1.5 tách: tags_w (trọng số 1.2) 0,52 << legacy 0,68, legacy_negtags 0,71 ≈ legacy -> thủ phạm là TRỌNG SỐ, negative thẻ trung tính; tags không trọng số n=2 chưa kết luận
    motivation: "CLIP không hiểu phủ định ('no trousers' trong negative đẩy xa 'trousers'); SDXL đọc thẻ tốt hơn câu; token đầu được chú ý nhất"
    priority: high
    prediction: "realvis_xl vs realvis_xl#legacy trên p001, p031, p050: attr TB tăng >= 0,05 và số ảnh có must_not giảm"

  - id: H16
    statement: "Ảnh tham chiếu CẮT theo thực thể (nhiều ảnh) cho IP-Adapter giữ đúng số người và bố cục prompt hơn ảnh nguyên bức, với CLIP attr không giảm"
    status: active
    motivation: "v1.3 p001: ảnh nhóm nguyên bức -> 3/4 ảnh sinh nhiều người; embedding mang theo bố cục"
    priority: high
    prediction: "realvis_xl+ref (cắt) vs sdxl_refplus v1.3 (nguyên bức): tỉ lệ ảnh đúng số người tăng, ref_sim TB giảm, attr TB không giảm quá 0,03"

  - id: H17
    statement: "Ảnh tham chiếu chỉ có lợi cho thực thể prior thấp; với prior cao nó không tăng attr mà tăng ref_sim (chép)"
    status: active
    motivation: "ImageRAG truy hồi có điều kiện; v1.3 p001 (áo dài, prior cao) refplus kéo bố cục"
    priority: high
    prediction: "p001 (áo dài): +ref không tăng attr TB >= 0,03 và ref_sim cao hơn; p012 (thuyền thúng): +ref tăng attr TB >= 0,10"
  - id: H18
    statement: "Chọn ảnh theo trung bình hạng nhiều verifier cho ảnh cuối được người đồng ý nhiều hơn chọn theo trung bình giá trị hoặc một verifier"
    status: active
    motivation: "Ma et al. 2025: verifier đơn bị hack; v1.3 identity bão hoà kéo mọi ảnh về gần nhau"
    priority: medium
    prediction: "Trên dev10, top-1 theo ensemble khác top-1 theo combined_score ở >= 30% prompt; trong các ca khác nhau người chọn ensemble >= 60%"
  - id: H19
    statement: "Best-of-N thích nghi (2 -> 6 theo verifier) giữ attr tốt nhất tương đương N=4 cố định với ít thời gian hơn trên model mạnh"
    status: active
    motivation: "Inference-time scaling: chi cho model/prompt cần, không chi đều"
    priority: medium
    prediction: "Trên p001: realvis_* dừng ở 2-4, dreamshaper/sdxl_base lên 6; attr tốt nhất mỗi model không giảm quá 0,03 so với v1.4 N=4"

