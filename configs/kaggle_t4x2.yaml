# Kaggle, 2x T4. VLM trên GPU 0, SDXL + CLIP trên GPU 1, không cần cpu_offload -> nhanh hơn ~2x.
llm:        {backend: qwen_vl, model: Qwen/Qwen2.5-VL-3B-Instruct, device: "cuda:0", max_new_tokens: 900, temperature: 0.1}
t2i:        {backend: sdxl, device: "cuda:1", cpu_offload: false, width: 1024, height: 1024, steps: 30, guidance: 6.5, n_candidates: 2, ip_adapter: true}
perception: {backend: vlm_clip, device: "cuda:1"}
retrieval:  {backend: wiki, download_images: true}
review:     {max_iters: 2, pass_threshold: 0.75, clip_weight: 0.35}
runs_dir: /kaggle/working/runs
