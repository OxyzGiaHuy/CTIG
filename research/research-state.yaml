outer_loop:
  cycle: 1
  last_direction: deepen
  last_reflection: >
    v1.2.1 p001: hạ tầng đã chạy trọn (6 model, LoRA, IP-Adapter). Thước đo danh tính bão hoà; thước đo
    thuộc tính mới là cái tách được lỗi "qipao hoá". Phương sai seed > phương sai model ở n=2.
    Hướng kế tiếp: A/B negative must_not (H9) cùng seed trên p001/p031, rồi p050/p012 với n=4.

workspace:
  findings: "research/findings.md"
  log: "research/research-log.md"
  experiments_dir: "research/experiments/"
  dev_subset: "data/dev10.txt"
