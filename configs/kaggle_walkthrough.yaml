# v1.3 walkthrough, Kaggle 1x T4 16 GB: hiển thị từng bước, so nhiều model, review agent TẮT.
# Bước 1-3 dùng Qwen (~7 GB) rồi giải phóng; bước 4 nạp từng model sinh ảnh (nhỏ trước, lớn sau), offload CPU.
# Hires fix TẮT (SDXL 1536px + offload quá chậm/OOM trên 1 T4); PickScore offload CPU nên vẫn dùng được.
llm:        {backend: qwen_vl, model: Qwen/Qwen2.5-VL-3B-Instruct, device: "cuda:0", max_new_tokens: 700, temperature: 0.0, cache: true}
perception: {backend: vlm_clip, clip_model: openai/clip-vit-base-patch32, device: "cuda:0"}
retrieval:  {backend: wiki, web_api: ddg, web_langs: [vi, en], download_images: true, ref_image_min_clip: 0.75, extract: true}
search_viz: {k_text: 5, k_images: 6, max_entities: 6}
max_candidate_entities: 6
review:     {enabled: false, max_iters: 2, pass_threshold: 0.75, clip_weight: 0.35}
judge:      {backend: blip2_itm, device: "cuda:0", offload: true}
models:     [dreamshaper8, sdxl_base, realvis_xl, sdxl_aodai, sdxl_refplus, playground25]
# v1.4 agent loop review: Summary (2c) · Filter ảnh tham chiếu (3b) · Filter+Rank ứng viên (4c) · một vòng sửa (4d)
agents:     {enabled: true, summary: true, enrich_prompt: false, ref_filter: true, candidate_review: true, k_candidates: 8, max_revisions: 1}
multigen:
  enabled: true
  device: "cuda:0"
  cpu_offload: true
  n_candidates: 3
  max_side: 1024
  itm: true
  scheduler: dpmpp_2m_karras
  long_prompt: true
  ref_images: 2
  ref_crop: true
  ref_scale: 0.4
  copy_threshold: 0.88
  hires:     {enabled: false, scale: 1.5, strength: 0.3, steps: 20}
  aesthetic: {enabled: true, device: "cuda:0", offload: true}
# t2i chỉ dùng khi bật lại vòng review (RUN_REVIEW=True trong notebook)
t2i:        {backend: sdxl, render: legacy, emphasis_weight: 1.2, device: "cuda:0", cpu_offload: true, width: 1024, height: 1024, steps: 25, guidance: 6.5,
             n_candidates: 2, ip_adapter: true, ip_adapter_scale: 0.3, init_negatives: true}
runs_dir: /kaggle/working/runs
