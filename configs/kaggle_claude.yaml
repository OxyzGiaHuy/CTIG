# Kaggle + Claude API làm agent và tri giác (ANTHROPIC_API_KEY trong Secrets). SDXL, CLIP, BLIP-2 local.
llm:        {backend: anthropic, model: claude-opus-5}
t2i:        {backend: sdxl, device: "cuda:0", cpu_offload: false, width: 1024, height: 1024, steps: 30, n_candidates: 2, ip_adapter: true, ip_adapter_scale: 0.3}
perception: {backend: vlm_clip, device: "cuda:0"}
retrieval:  {backend: wiki, web_api: ddg, web_langs: [vi, en], extract: true, ref_image_min_clip: 0.75}
judge:      {backend: blip2_itm, device: "cuda:0"}
review:     {max_iters: 2}
runs_dir: /kaggle/working/runs
