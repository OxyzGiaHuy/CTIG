# v1.3 walkthrough, Kaggle 2x T4: Qwen + CLIP + BLIP-2 + PickScore ở GPU 0, model sinh ảnh ở GPU 1 (không offload, 1024px).
# Tối ưu ảnh cuối: 4 ứng viên/model (best-of-N), DPM++ 2M Karras, compel cho prompt dài, hires fix x1.5, RealVisXL.
llm:        {backend: qwen_vl, model: Qwen/Qwen2.5-VL-3B-Instruct, device: "cuda:0", max_new_tokens: 700, temperature: 0.0, cache: true}
perception: {backend: vlm_clip, clip_model: openai/clip-vit-base-patch32, device: "cuda:0"}
retrieval:  {backend: wiki, web_api: ddg, web_langs: [vi, en], download_images: true, ref_image_min_clip: 0.75, extract: true}
search_viz: {k_text: 5, k_images: 6, max_entities: 6}
max_candidate_entities: 6
review:     {enabled: false, max_iters: 2, pass_threshold: 0.75, clip_weight: 0.35}
judge:      {backend: blip2_itm, device: "cuda:0", offload: true}
# Thứ tự nhỏ -> lớn. sd35_medium (gated, fp16 trên T4) và sweep LoRA (sdxl_aodai@0.6 ...) thêm tay khi cần.
# realvis_xl#legacy = cùng model, prompt render kiểu v1.3 (cảnh trước, câu dài, negative có 'no trousers') để A/B với render 'tags' mặc định.
# +ref = cùng model + IP-Adapter Plus với ảnh tham chiếu ĐÃ CẮT theo thực thể (multigen.ref_crop) ở scale ref_scale.
# sdxl_refplus giữ nguyên (RealVis + IP-Adapter, cùng ảnh đã cắt) để so với realvis_xl+ref chỉ khác scale; realvis_aodai+ref = LoRA + ảnh.
models:     [dreamshaper8, sdxl_base, realvis_xl, realvis_xl#legacy, realvis_xl+ref, sdxl_aodai, realvis_aodai, realvis_aodai+ref, sdxl_refplus, playground25]
# v1.4 agent loop review: Summary (2c) · Filter ảnh tham chiếu (3b) · Filter+Rank ứng viên (4c) · một vòng sửa (4d)
agents:     {enabled: true, summary: true, enrich_prompt: false, ref_filter: true, candidate_review: true, k_candidates: 8, max_revisions: 1}
multigen:
  enabled: true
  device: "cuda:1"
  cpu_offload: false
  n_candidates: 4
  max_side: 1024
  itm: true
  scheduler: dpmpp_2m_karras
  long_prompt: true
  ref_images: 3
  ref_crop: true
  ref_scale: 0.4
  copy_threshold: 0.88
  hires:     {enabled: true, scale: 1.5, strength: 0.3, steps: 20}
  aesthetic: {enabled: true, device: "cuda:0", offload: true}
t2i:        {backend: sdxl, render: tags, emphasis_weight: 1.2, device: "cuda:1", cpu_offload: false, width: 1024, height: 1024, steps: 30, guidance: 6.5,
             n_candidates: 2, ip_adapter: true, ip_adapter_scale: 0.3, init_negatives: true}
runs_dir: /kaggle/working/runs
